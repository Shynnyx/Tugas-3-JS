<!DOCTYPE html>
<html>
<head>
    <title>Tugas 3 JavaScript</title>
</head>
<body>

    <h1>Daftar Produk Toko</h1> 

    <button onclick="tambahProduk()">Tambah Produk</button>
<button onclick="hapusProduk()">Hapus Produk</button>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama Produk</th>
                <th>Harga</th>
                <th>Stok</th>
            </tr>
        </thead>

        <tbody id="daftarProduk">
        </tbody>
    </table>

    <script>

        let produkToko = [
    {id: 1, nama: "Laptop", harga: 7000000, stok: 5},
    {id: 2, nama: "Mouse", harga: 200000, stok: 10},
    {id: 3, nama: "Keyboard", harga: 350000, stok: 7}
];

function tambahProduk() {
    let nama = prompt("Masukkan nama produk:");
    let harga = Number(prompt("Masukkan harga produk:"));
    let stok = Number(prompt("Masukkan stok produk:"));

    let idBaru = produkToko.length + 1;

    produkToko.push({
        id: idBaru,
        nama: nama,
        harga: harga,
        stok: stok
    });

    tampilkanProduk();
}

function hapusProduk() {
    let id = Number(prompt("Masukkan ID produk yang ingin dihapus:"));

    let index = produkToko.findIndex(function(produk) {
        return produk.id === id;
    });

    if (index !== -1) {
        produkToko.splice(index, 1);
        tampilkanProduk();
    } else {
        alert("Produk tidak ditemukan!");
    }
}

function tampilkanProduk() {
    let tabel = "";

    produkToko.forEach(function(produk) {
        tabel += `
            <tr>
                <td>${produk.id}</td>
                <td>${produk.nama}</td>
                <td>Rp ${produk.harga.toLocaleString("id-ID")}</td>
                <td>${produk.stok}</td>
            </tr>
        `;
    });

    document.getElementById("daftarProduk").innerHTML = tabel;
}
tampilkanProduk();

    </script>

</body>
</html>
